<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        header { border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .btn { display: inline-block; background: #0066cc; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>Hello, I'm [Your Name]</h1>
        <p>Welcome to my online portfolio.</p>
        <!-- Link to open/download your uploaded PDF -->
        <a href="resume.pdf" class="btn" target="_blank">View PDF Document</a>
    </header>

    <main>
        <h2>Portfolio Document</h2>
        <!-- Embeds your PDF directly on the page -->
        <iframe src="resume.pdf"></iframe>
    </main>
</body>
</html>
